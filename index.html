<!DOCTYPE html>
<!--
VYDE — single-file frontend (GitHub Pages compatible, no build step, no secrets)

LOCAL MODE (default)
  Real persistent browser-local storage. The selected File is stored as a Blob in IndexedDB
  ("vyde-media"), read back to verify, and restored after refresh. Only THIS browser profile can
  see or play these files. Local uploads are NOT global and NOT on a server.

REMOTE MODE
  Requires a real backend + object storage. Set VYDE_CONFIG.remote.baseUrl and provide
  VYDE_CONFIG.remote.getAccessToken (async, returns a short-lived token from YOUR auth flow).
  Until then RemoteVideoBackend throws BackendNotConfiguredError. Nothing is simulated.
  GitHub Pages alone cannot provide central storage, auth, or transcoding.

BACKEND CONTRACT (all calls: Authorization: Bearer <short-lived-access-token>)
  POST   /api/uploads/session        {filename,mimeType,size,title,...} -> {uploadId,uploadUrl,chunkSize}
         (uploadUrl = pre-signed resumable URL; chunks PUT with Content-Range; no credentials in frontend)
  POST   /api/uploads/:id/complete   -> video record (backend verifies the stored object, then status PROCESSING -> READY)
  GET    /api/videos?q=              -> [video]
  GET    /api/videos/:id             -> video
  GET    /api/videos/:id/original    -> {url (signed, temporary), filename, expiresAt}
  GET    /api/videos/:id/thumbnail   -> {url}
  PATCH  /api/videos/:id             -> video   (title, description, category, tags, visibility, allowComments, published)
  DELETE /api/videos/:id             -> 204     (server MUST authorize: owner or moderator/admin only)
  The UI hides destructive actions from non-owners, but the server is the real authority.

STATES  SELECTED -> VALIDATING -> STORING -> STORED -> READY
        errors: VALIDATION_ERROR, STORAGE_ERROR, CANCELLED. No fake percentages, ever.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYDE</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{--bg:#17100b;--card:#2a1c13;--line:#43301f;--ink:#f4ecdf;--mut:#b9a58d;--acc:#e6a95a;--acc2:#b8623a;--ok:#8fc79a;--bad:#f0867a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1100px 560px at 85% -10%,#3d2515 0,transparent 60%),var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4vw,42px)}h2{font-size:22px;margin:32px 0 14px}h3{font-size:16px}
a{color:inherit;text-decoration:none}p{margin:8px 0}.mut{color:var(--mut)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.side{padding:24px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh}
.logo{font:700 30px Fraunces,serif;letter-spacing:.05em;padding:0 12px 20px;background:linear-gradient(90deg,var(--ink),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.side a{display:block;padding:10px 12px;border-radius:10px;color:var(--mut)}
.side a.on,.side a:hover{background:var(--card);color:var(--ink)}
main{padding:28px clamp(16px,4vw,48px) 110px;max-width:1240px;width:100%}
.bot{display:none}
@media(max-width:899px){.app{display:block}.side{display:none}
.bot{display:flex;position:fixed;inset:auto 0 0 0;background:#120c08ee;backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
.bot a{flex:1;text-align:center;padding:8px 2px;font-size:12px;color:var(--mut)}.bot a.on{color:var(--acc)}}
.hero{border:1px solid var(--line);border-radius:22px;padding:clamp(22px,4vw,44px);background:linear-gradient(135deg,#3b2415,#1d120b 70%);margin-bottom:8px}
.hero p{max-width:60ch;color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:999px;padding:10px 20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1b0f08;font:600 14px system-ui;cursor:pointer;margin:6px 8px 6px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid #6b3530}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,hsl(var(--h,25) 45% 30%),hsl(calc(var(--h,25) + 40) 55% 10%));display:grid;place-items:center;color:var(--mut);font-size:12px}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;font:600 10px system-ui;letter-spacing:.06em;padding:3px 8px;border-radius:6px;background:#000a;color:var(--ink)}
.tag.mine{background:var(--acc);color:#1b0f08}
.dur{position:absolute;right:8px;bottom:8px;font:600 11px system-ui;background:#000b;padding:2px 6px;border-radius:5px}
.card h3{margin:10px 0 2px}.card p{margin:0;color:var(--mut);font-size:13px}
.row{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin:12px 0}
@media(max-width:600px){.row{grid-template-columns:100px 1fr}}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.badge.ok{color:var(--ok);border-color:#3f6b4a}
.player{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.player video{width:100%;height:100%;display:block;background:#000}
.unavail{aspect-ratio:16/9;display:grid;place-items:center;text-align:center;padding:20px;border-radius:16px;border:1px dashed var(--line);background:var(--card);color:var(--mut)}
.panel{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:20px;margin:16px 0}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px;flex-wrap:wrap}
.steps li{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}
.steps li.done{color:var(--ok);border-color:#3f6b4a}.steps li.on{color:#1b0f08;background:var(--acc);border-color:var(--acc)}
.drop{display:grid;place-items:center;text-align:center;min-height:200px;border:2px dashed var(--line);border-radius:18px;cursor:pointer;padding:20px}
.drop.over{border-color:var(--acc);background:#3d251533}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0}dt{color:var(--mut)}dd{margin:0;word-break:break-all}
.form{display:grid;gap:12px;margin:14px 0}
label{display:grid;gap:4px;font-size:13px;color:var(--mut)}label.chk{display:flex;gap:8px;align-items:center}
input:not([type=checkbox]),textarea,select{background:#120c08;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%}
.sf{display:flex;gap:8px;margin-bottom:18px}
.msg{padding:10px 14px;border-radius:12px;margin:12px 0;border:1px solid var(--line)}
.msg.ok{border-color:#3f6b4a;color:var(--ok)}.msg.err{border-color:#6b3530;color:var(--bad)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);display:inline-block;vertical-align:middle;margin-right:8px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
.empty{text-align:center;padding:60px 10px}
.av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;font:700 30px Fraunces,serif;color:#1b0f08}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);padding:10px 18px;border-radius:12px;z-index:9;display:none}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
"use strict";
/* ---------- Config, errors, helpers ---------- */
class BackendNotConfiguredError extends Error{constructor(m){super(m||"No remote backend is configured. Set VYDE_CONFIG.remote.baseUrl and getAccessToken.");this.name="BackendNotConfiguredError"}}
const VYDE_CONFIG={remote:{baseUrl:"",getAccessToken:null}};
const ME={id:"local-user",name:"You",isAdmin:false}; // remote mode: identity comes from the server token, never from here
const CATS=["Entertainment","Education","Music","Travel","Food","Sports","Gaming","Other"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtB=n=>{if(!n&&n!==0)return"—";const u=["B","KB","MB","GB","TB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]};
const fmtD=s=>{if(!s)return"—";s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
const toast=(m,bad)=>{const t=$("#toast");t.textContent=m;t.style.display="block";t.style.color=bad?"var(--bad)":"var(--ink)";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)};
const errMsg=e=>e&&e.name==="QuotaExceededError"?"Not enough browser storage for this file. Free space or choose a smaller file.":(e&&e.message)||"Unknown error.";
const BM=()=>{try{return JSON.parse(localStorage.getItem("vyde.bm")||"[]")}catch{return[]}};
const setBM=a=>{try{localStorage.setItem("vyde.bm",JSON.stringify(a))}catch{}};
const URLS=new Set();const track=u=>(URLS.add(u),u);
const freeURLs=()=>{URLS.forEach(u=>URL.revokeObjectURL(u));URLS.clear()};
const urlOf=o=>o&&o.blob?track(URL.createObjectURL(o.blob)):(o&&o.url)||null;
const canManage=v=>v.source==="user"&&(v.ownerId===ME.id||ME.isAdmin);

/* ---------- IndexedDB ---------- */
let dbp;
const DB=()=>dbp||(dbp=new Promise((ok,no)=>{
  if(!window.indexedDB)return no(new Error("IndexedDB is not available in this browser."));
  const r=indexedDB.open("vyde-media",1);
  r.onupgradeneeded=()=>{r.result.createObjectStore("videos",{keyPath:"id"});r.result.createObjectStore("blobs")};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);r.onblocked=()=>no(new Error("IndexedDB is blocked by another tab."));
}));
const tx=async(stores,mode,fn)=>{const d=await DB();return new Promise((ok,no)=>{
  const t=d.transaction(stores,mode);let v;
  try{v=fn(t)}catch(e){try{t.abort()}catch{}return no(e)}
  t.oncomplete=()=>ok(v&&"result" in v?v.result:v);
  t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||new DOMException("Transaction aborted","AbortError"));
})};

/* ---------- LOCAL backend: real IndexedDB Blob storage ---------- */
const LocalVideoBackend={
  mode:"local",
  async createUploadSession(file,meta){return{id:crypto.randomUUID(),file,meta}},
  async upload(s,file,emit){
    const{id,meta}=s,now=Date.now();
    const rec={id,ownerId:ME.id,filename:file.name,mimeType:file.type||"",size:file.size,createdAt:now,updatedAt:now,
      duration:meta.duration,width:meta.width,height:meta.height,title:meta.title,description:meta.description,category:meta.category,
      tags:meta.tags,visibility:meta.visibility,allowComments:meta.allowComments,thumbnail:!!meta.thumb,
      originalBlobKey:id+":original",thumbBlobKey:meta.thumb?id+":thumb":null,playbackBlobKey:null,status:"STORED",published:false};
    emit("STORING");
    await tx(["videos","blobs"],"readwrite",t=>{ // one atomic transaction: blob + thumbnail + metadata, or nothing
      const b=t.objectStore("blobs");b.put(file,rec.originalBlobKey);
      if(meta.thumb)b.put(meta.thumb,rec.thumbBlobKey);
      t.objectStore("videos").put(rec);
    });
    const back=await tx("blobs","readonly",t=>t.objectStore("blobs").get(rec.originalBlobKey)); // read-back verification
    if(!back||back.size!==file.size)throw new Error("Verification failed: the stored file could not be read back intact.");
    return rec;
  },
  async getVideo(id){return tx("videos","readonly",t=>t.objectStore("videos").get(id))},
  async listVideos(){const a=await tx("videos","readonly",t=>t.objectStore("videos").getAll());return a.sort((x,y)=>y.createdAt-x.createdAt)},
  async getOriginal(id){
    const m=await this.getVideo(id);if(!m)return null;
    const blob=await tx("blobs","readonly",t=>t.objectStore("blobs").get(m.playbackBlobKey||m.originalBlobKey));
    return blob?{blob,filename:m.filename}:null;
  },
  async getDownload(id){ // ALWAYS the untouched original, never a playback derivative
    const m=await this.getVideo(id);if(!m)return null;
    const blob=await tx("blobs","readonly",t=>t.objectStore("blobs").get(m.originalBlobKey));
    return blob?{blob,filename:m.filename}:null;
  },
  async getThumbnail(id){
    const m=await this.getVideo(id);if(!m||!m.thumbBlobKey)return null;
    const blob=await tx("blobs","readonly",t=>t.objectStore("blobs").get(m.thumbBlobKey));
    return blob?{blob}:null;
  },
  async updateVideo(id,p){
    const m=await this.getVideo(id);if(!m)throw new Error("Video not found.");
    if(m.ownerId!==ME.id&&!ME.isAdmin)throw new Error("You are not allowed to edit this video.");
    const n={...m,updatedAt:Date.now()};
    for(const k of["title","description","category","tags","visibility","allowComments"])if(k in p)n[k]=p[k];
    await tx("videos","readwrite",t=>t.objectStore("videos").put(n));return n;
  },
  async publishVideo(id){
    const m=await this.getVideo(id);if(!m)throw new Error("Video not found.");
    if(m.ownerId!==ME.id&&!ME.isAdmin)throw new Error("You are not allowed to publish this video.");
    const n={...m,published:true,status:"READY",updatedAt:Date.now()};
    await tx("videos","readwrite",t=>t.objectStore("videos").put(n));return n;
  },
  async deleteVideo(id){
    const m=await this.getVideo(id);if(!m)return;
    if(m.ownerId!==ME.id&&!ME.isAdmin)throw new Error("You are not allowed to delete this video.");
    await tx(["videos","blobs"],"readwrite",t=>{
      const b=t.objectStore("blobs");[m.originalBlobKey,m.thumbBlobKey,m.playbackBlobKey].filter(Boolean).forEach(k=>b.delete(k));
      t.objectStore("videos").delete(id);
    });
    const left=await tx("blobs","readonly",t=>t.objectStore("blobs").count(IDBKeyRange.bound(id+":",id+":\uffff")));
    if(left||await this.getVideo(id))throw new Error("Deletion could not be verified. Reload and try again.");
  }
};

/* ---------- REMOTE backend: real contract, real chunked upload, no simulation ---------- */
const RemoteVideoBackend={
  mode:"remote",
  async _r(method,path,body){
    const c=VYDE_CONFIG.remote;
    if(!c.baseUrl||typeof c.getAccessToken!=="function")throw new BackendNotConfiguredError();
    const token=await c.getAccessToken();
    const r=await fetch(c.baseUrl+path,{method,headers:{Authorization:"Bearer "+token,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error(`The server rejected the request (${r.status}).`);
    return r.status===204?null:r.json();
  },
  createUploadSession(file,meta){const{thumb,...m}=meta;return this._r("POST","/api/uploads/session",{filename:file.name,mimeType:file.type,size:file.size,...m})},
  async upload(s,file,emit){
    const cs=s.chunkSize||8*1024*1024;emit("STORING");
    for(let o=0;o<file.size;o+=cs){ // bytes are only reported after the storage endpoint acknowledged them
      const c=file.slice(o,Math.min(o+cs,file.size));
      const r=await fetch(s.uploadUrl,{method:"PUT",headers:{"Content-Range":`bytes ${o}-${o+c.size-1}/${file.size}`},body:c});
      if(![200,201,204,308].includes(r.status))throw new Error(`Storage rejected a chunk (${r.status}).`);
      emit({loaded:o+c.size,total:file.size});
    }
    return this._r("POST",`/api/uploads/${s.uploadId}/complete`,{});
  },
  getVideo(id){return this._r("GET","/api/videos/"+id)},
  listVideos(q){return this._r("GET","/api/videos"+(q?"?q="+encodeURIComponent(q):""))},
  getOriginal(id){return this._r("GET",`/api/videos/${id}/original`)},
  getDownload(id){return this._r("GET",`/api/videos/${id}/original`)},
  getThumbnail(id){return this._r("GET",`/api/videos/${id}/thumbnail`)},
  updateVideo(id,p){return this._r("PATCH","/api/videos/"+id,p)},
  publishVideo(id){return this._r("PATCH","/api/videos/"+id,{published:true})},
  deleteVideo(id){return this._r("DELETE","/api/videos/"+id)}
};
const VideoBackend=VYDE_CONFIG.remote.baseUrl?RemoteVideoBackend:LocalVideoBackend;
const modeText=()=>VideoBackend.mode==="local"?"Local mode: videos you add are stored only in this browser. Nobody else can see them.":"Connected to VYDE. Videos are stored centrally.";

/* ---------- Validation and real media analysis ---------- */
const EXT=/\.(mp4|m4v|mov|webm|ogv|ogg|mkv)$/i;
function validate(f){
  if(!(f instanceof File))return"No file was selected.";
  if(f.size===0)return"This file is empty (0 bytes).";
  if(!EXT.test(f.name))return"Unsupported file extension. Use MP4, M4V, MOV, WebM, OGV or MKV.";
  if(f.type&&!f.type.startsWith("video/"))return`This file is not a video (type: ${f.type}).`;
  return null;
}
function probe(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),v=document.createElement("video");let info=null,t;
  v.preload="metadata";v.muted=true;v.playsInline=true;
  const done=(f,x)=>{clearTimeout(t);v.onerror=v.onloadedmetadata=v.onseeked=null;v.removeAttribute("src");v.load();URL.revokeObjectURL(url);f(x)};
  t=setTimeout(()=>info?done(res,{...info,thumb:null}):done(rej,new Error("Timed out while reading video metadata.")),20000);
  v.onerror=()=>done(rej,new Error("The browser cannot read this file as a video."));
  v.onloadedmetadata=()=>{
    if(!v.videoWidth||!v.videoHeight)return done(rej,new Error("No video track found in this file."));
    const d=isFinite(v.duration)?v.duration:0;
    info={duration:d,width:v.videoWidth,height:v.videoHeight};
    v.currentTime=d>0?Math.min(Math.max(d*.1,.1),d/2):0;
  };
  v.onseeked=()=>{
    const c=document.createElement("canvas"),k=Math.min(1,640/v.videoWidth);
    c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    try{c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(b=>done(res,{...info,thumb:b||null}),"image/jpeg",.82)}
    catch{done(res,{...info,thumb:null})}
  };
  v.src=url;
})}

/* ---------- Data ---------- */
const DEMO=[
 ["Golden hour over the rooftops","Nima Farahani","Travel","sunset, city"],
 ["Slow espresso, poured in 4K","Roast Lab","Food","coffee, macro"],
 ["Night ride through Shiraz","Kian Motion","Travel","night, drive"],
 ["Piano in an empty hall","Lena Arvid","Music","piano, ambient"],
 ["Ten-minute home workout","Sara Fit","Sports","workout"],
 ["Why cinema still uses film","Reel Notes","Education","film, essay"]
].map((d,i)=>({id:"demo-"+(i+1),source:"demo",ownerId:"demo",ownerName:d[1],title:d[0],category:d[2],tags:d[3].split(", "),
  description:"Demo entry with generated artwork. It has no media file.",hue:i*52+20,published:true,visibility:"public"}));
const all=async q=>(await VideoBackend.listVideos(q)).map(x=>({...x,source:"user",ownerName:ME.name}));
const getMeta=async id=>DEMO.find(d=>d.id===id)||await VideoBackend.getVideo(id).then(v=>v&&{...v,source:"user",ownerName:ME.name});
async function thumbs(list){const m={};await Promise.all(list.filter(v=>v.thumbnail).map(async v=>{try{const u=urlOf(await VideoBackend.getThumbnail(v.id));if(u)m[v.id]=u}catch{}}));return m}
const estimate=async()=>{try{const e=await navigator.storage.estimate();return`Browser storage: ${fmtB(e.usage)} used of ${fmtB(e.quota)}.`}catch{return""}};

/* ---------- UI pieces ---------- */
const card=(v,u)=>{const demo=v.source==="demo";
  return`<a class="card" href="#/watch/${v.id}"><div class="th" ${demo?`style="--h:${v.hue}"`:""}>${u?`<img src="${u}" alt="">`:demo?"":"No preview frame"}<span class="tag ${demo?"":"mine"}">${demo?"DEMO VIDEO":"USER UPLOADED VIDEO"}</span>${v.duration?`<b class="dur">${fmtD(v.duration)}</b>`:""}</div><h3>${esc(v.title)}</h3><p>${esc(v.ownerName)}, ${esc(v.category)}</p></a>`};
const NAV=[["home","Home"],["search","Search"],["upload","Upload"],["my","My videos"],["profile","Profile"]];
const shell=(r,h)=>`<div class="app"><nav class="side"><div class="logo">VYDE</div>${NAV.map(n=>`<a href="#/${n[0]}" class="${r===n[0]?"on":""}">${n[1]}</a>`).join("")}</nav><main>${h}</main></div><nav class="bot">${NAV.map(n=>`<a href="#/${n[0]}" class="${r===n[0]?"on":""}">${n[1]}</a>`).join("")}</nav>`;
const notFound=()=>`<div class="empty"><h2>Video not found</h2><p class="mut">It may have been deleted from this browser.</p><a class="btn" href="#/home">Back to Home</a></div>`;
const formH=f=>`<div class="form">
<label>Title<input id="f-title" maxlength="120" value="${esc(f.title)}"></label>
<label>Description<textarea id="f-desc" rows="3">${esc(f.description)}</textarea></label>
<label>Category<select id="f-cat">${CATS.map(c=>`<option ${c===f.category?"selected":""}>${c}</option>`).join("")}</select></label>
<label>Tags (comma separated)<input id="f-tags" value="${esc((f.tags||[]).join(", "))}"></label>
<label>Visibility<select id="f-vis"><option value="public" ${f.visibility!=="private"?"selected":""}>Listed in Home and Search</option><option value="private" ${f.visibility==="private"?"selected":""}>Private (My videos only)</option></select></label>
<label class="chk"><input type="checkbox" id="f-com" ${f.allowComments!==false?"checked":""}> Allow comments</label></div>`;
const readForm=()=>({title:($("#f-title").value.trim()||"Untitled video").slice(0,120),description:$("#f-desc").value.trim(),category:$("#f-cat").value,
  tags:$("#f-tags").value.split(",").map(s=>s.trim()).filter(Boolean),visibility:$("#f-vis").value,allowComments:$("#f-com").checked});
const actions=v=>`<a class="btn" href="#/watch/${v.id}">Watch</a><button class="btn ghost" data-act="dl" data-id="${v.id}">Download Original</button>${canManage(v)?`<a class="btn ghost" href="#/edit/${v.id}">Edit</a><button class="btn danger" data-act="del" data-id="${v.id}">Delete</button>`:""}`;

/* ---------- Upload state machine ---------- */
let U={s:"IDLE",tok:Symbol()};
const STEPS=["Choose file","Selected","Analyzing video","Saving video","Saved","Publish"];
const IDX={IDLE:0,VALIDATION_ERROR:0,CANCELLED:0,SELECTED:1,VALIDATING:2,ANALYZED:3,STORING:3,STORAGE_ERROR:3,STORED:4,READY:6};
function resetU(){if(U.thumbURL)URL.revokeObjectURL(U.thumbURL);U={s:"IDLE",tok:Symbol()}}
function ru(){const el=$("#ub");if(el)el.innerHTML=uploadH()}
function fail(s,m){U.s=s;U.err=m;ru()}
function uploadH(){
  const i=IDX[U.s],st=`<ol class="steps">${STEPS.map((s,k)=>`<li class="${k<i?"done":k===i?"on":""}">${s}</li>`).join("")}</ol>`;
  const f=U.file,err=U.err?`<div class="msg err" role="alert">${esc(U.err)}</div>`:"";
  if(["IDLE","VALIDATION_ERROR","CANCELLED"].includes(U.s))return st+err+`<label class="drop" id="drop"><input type="file" id="file" accept="video/*,.mkv,.mov"><div><h3>Choose a video file</h3><p class="mut">Drop a file here or tap to browse. MP4, MOV, WebM, OGV, MKV.</p><p class="mut">${modeText()}</p></div></label>`;
  if(U.s==="SELECTED"||U.s==="VALIDATING")return st+`<p><span class="spin"></span>${U.s==="SELECTED"?"File selected":"Analyzing video"}: ${esc(f.name)}</p><button class="btn ghost" data-act="cancel">Cancel</button>`;
  const info=`<dl><dt>Filename</dt><dd>${esc(f.name)}</dd><dt>Size</dt><dd>${fmtB(f.size)}</dd><dt>MIME type</dt><dd>${esc(f.type||"not reported by browser")}</dd><dt>Duration</dt><dd>${U.duration?fmtD(U.duration):"not reported"}</dd><dt>Dimensions</dt><dd>${U.width}×${U.height}</dd></dl>`;
  const th=U.thumbURL?`<div class="th" style="max-width:360px"><img src="${U.thumbURL}" alt="Frame from your video"></div>`:`<p class="mut">No preview frame could be extracted from this file.</p>`;
  if(U.s==="ANALYZED"||U.s==="STORAGE_ERROR")return st+err+th+info+`<p class="mut">Browser-side compression is unavailable. Original file will be stored.</p>`+formH(U.form||{title:U.title,tags:[],visibility:"public",category:CATS[0],allowComments:true,description:""})+`<button class="btn" data-act="save">Save video</button><button class="btn ghost" data-act="cancel">Choose a different file</button>`;
  if(U.s==="STORING"){const p=U.prog;return st+`<p><span class="spin"></span>${p?`Uploading ${fmtB(p.loaded)} of ${fmtB(p.total)}`:"Saving video..."}</p><p class="mut">Keep this tab open until saving finishes.</p>`}
  const rec=U.rec,remote=VideoBackend.mode==="remote";
  if(U.s==="STORED")return st+`<div class="msg ok">${remote?"Uploaded to VYDE.":"Video saved to this browser."}</div><p class="mut">Not published yet. ${remote?"":"Only this browser can play it."}</p>`+th+formH(rec)+`<button class="btn" data-act="pub">Publish</button><a class="btn ghost" href="#/watch/${rec.id}">Watch</a><button class="btn ghost" data-act="dl" data-id="${rec.id}">Download Original</button>`;
  return st+`<div class="msg ok">${remote?"Published on VYDE.":"Published in this browser's library."}</div>${th}`+actions({...rec,source:"user"})+`<button class="btn ghost" data-act="again">Add another video</button>`;
}
async function pick(file){
  resetU();const tok=U.tok;U={...U,s:"SELECTED",file};ru();
  const e=validate(file);if(e)return fail("VALIDATION_ERROR",e);
  U.s="VALIDATING";ru();
  try{
    if(VideoBackend.mode==="local"&&navigator.storage&&navigator.storage.estimate){const s=await navigator.storage.estimate();if(s.quota&&s.quota-s.usage<file.size)throw new Error(`Not enough browser storage: this file is ${fmtB(file.size)}, about ${fmtB(s.quota-s.usage)} is available.`)}
    const info=await probe(file);if(U.tok!==tok)return;
    Object.assign(U,info,{s:"ANALYZED",thumbURL:info.thumb?URL.createObjectURL(info.thumb):null,title:file.name.replace(/\.[^.]+$/,"")});ru();
  }catch(x){if(U.tok===tok)fail("VALIDATION_ERROR",errMsg(x))}
}
async function saveVideo(){
  U.form=readForm();const tok=U.tok,meta={...U.form,duration:U.duration,width:U.width,height:U.height,thumb:U.thumb};
  U.s="STORING";U.err=null;U.prog=null;ru();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch{}
  try{
    const s=await VideoBackend.createUploadSession(U.file,meta);
    const rec=await VideoBackend.upload(s,U.file,p=>{if(typeof p==="object")U.prog=p;ru()});
    U.rec=rec;U.s="STORED";ru();
  }catch(e){if(U.tok===tok)fail("STORAGE_ERROR",errMsg(e))}
}
async function publish(){
  try{await VideoBackend.updateVideo(U.rec.id,readForm());U.rec=await VideoBackend.publishVideo(U.rec.id);U.s="READY";ru()}
  catch(e){toast(errMsg(e),1)}
}

/* ---------- Actions ---------- */
async function download(id){
  try{
    const o=await VideoBackend.getDownload(id);
    if(!o||(!o.blob&&!o.url))return toast("The original file is unavailable.",1);
    const a=document.createElement("a");a.href=o.blob?URL.createObjectURL(o.blob):o.url;a.download=o.filename||"video";
    document.body.appendChild(a);a.click();a.remove();
    if(o.blob)setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  }catch(e){toast(errMsg(e),1)}
}
async function del(id){
  const v=await getMeta(id);if(!v||!canManage(v))return;
  if(!confirm(`Delete "${v.title}"? This permanently removes the video file${VideoBackend.mode==="local"?" from this browser":""}. This cannot be undone.`))return;
  try{
    await VideoBackend.deleteVideo(id);setBM(BM().filter(x=>x!==id));
    if(U.rec&&U.rec.id===id)resetU();
    toast("Video deleted.");go("#/my");
  }catch(e){toast(errMsg(e),1)}
}
window.vidErr=el=>{const d=document.createElement("div");d.className="unavail";d.textContent="This browser can't play this file. Download the original to open it elsewhere.";el.replaceWith(d)};

/* ---------- Views ---------- */
const VIEWS={
  async home(){
    const L=(await all()).filter(v=>v.published&&v.visibility==="public"),th=await thumbs(L);
    return`<section class="hero"><h1>Watch it. Keep it. Own the file.</h1><p>${modeText()}</p><a class="btn" href="#/upload">Add a video</a></section>
    <h2>Your library</h2>${L.length?`<div class="grid">${L.map(v=>card(v,th[v.id])).join("")}</div>`:`<p class="mut">Nothing here yet. Videos appear after you save and publish them.</p>`}
    <h2>Demo videos</h2><div class="grid">${DEMO.map(v=>card(v)).join("")}</div>`;
  },
  async search(q){
    const L=(await all()).filter(v=>v.published&&v.visibility==="public"),th=await thumbs(L),s=q.toLowerCase().trim();
    const R=L.concat(DEMO).filter(v=>!s||[v.title,v.description,v.category,v.filename,(v.tags||[]).join(" ")].join(" ").toLowerCase().includes(s));
    return`<h1>Search</h1><form class="sf" data-act="search" style="margin-top:16px"><input id="q" type="search" placeholder="Titles, tags, filenames" value="${esc(q)}"><button class="btn" style="margin:0">Search</button></form>
    ${R.length?`<div class="grid">${R.map(v=>card(v,th[v.id])).join("")}</div>`:`<p class="mut">No videos match "${esc(q)}".</p>`}`;
  },
  async upload(){return`<h1>Add a video</h1><p class="mut">${modeText()}</p><div class="panel" id="ub">${uploadH()}</div>`},
  async my(){
    const L=await all(),th=await thumbs(L);
    return`<h1>My videos</h1><p class="mut">${modeText()} ${await estimate()}</p>`+(L.length?L.map(v=>`<div class="row"><div class="th">${th[v.id]?`<img src="${th[v.id]}" alt="">`:"No preview frame"}</div><div><h3>${esc(v.title)}</h3><p class="mut">${esc(v.filename)}, ${fmtB(v.size)}</p><span class="badge ${v.published?"ok":""}">${v.published?(v.visibility==="private"?"Published, private":"Published"):"Saved, not published"}</span><div>${actions(v)}</div></div></div>`).join(""):`<div class="empty"><p class="mut">You haven't added any videos.</p><a class="btn" href="#/upload">Add a video</a></div>`);
  },
  async watch(id){
    const v=await getMeta(id);if(!v||(v.visibility==="private"&&!canManage(v)))return notFound();
    let body;
    if(v.source==="demo")body=`<div class="unavail"><div><h3>Video file is unavailable.</h3><p>This is a demo entry. It has no media file.</p></div></div>`;
    else{
      const o=await VideoBackend.getOriginal(id).catch(()=>null),src=urlOf(o),ph=urlOf(await VideoBackend.getThumbnail(id).catch(()=>null));
      body=src?`<div class="player"><video controls playsinline preload="metadata" src="${src}" ${ph?`poster="${ph}"`:""} onerror="vidErr(this)"></video></div>`:`<div class="unavail"><div><h3>Video file is unavailable.</h3><p>The file is not stored here anymore.</p></div></div>`;
    }
    const saved=BM().includes(id);
    return`${body}<h1 style="margin-top:18px">${esc(v.title)}</h1><p><span class="badge ${v.source==="user"?"ok":""}">${v.source==="demo"?"DEMO VIDEO":"USER UPLOADED VIDEO"}</span> <span class="badge">${esc(v.category)}</span></p>
    <p>${esc(v.description)}</p>${(v.tags||[]).length?`<p class="mut">Tags: ${esc(v.tags.join(", "))}</p>`:""}
    ${v.source==="user"?`<dl><dt>Filename</dt><dd>${esc(v.filename)}</dd><dt>Size</dt><dd>${fmtB(v.size)}</dd><dt>Type</dt><dd>${esc(v.mimeType||"unknown")}</dd><dt>Duration</dt><dd>${fmtD(v.duration)}</dd><dt>Dimensions</dt><dd>${v.width}×${v.height}</dd><dt>Saved</dt><dd>${new Date(v.createdAt).toLocaleString()}</dd><dt>Status</dt><dd>${esc(v.status)}${VideoBackend.mode==="local"?", visible in this browser only":""}</dd></dl>`:""}
    <div>${v.source==="user"?actions(v):""}<button class="btn ghost" data-act="bm" data-id="${id}">${saved?"Remove from saved":"Save for later"}</button></div>`;
  },
  async edit(id){
    const v=await getMeta(id);if(!v||!canManage(v))return notFound();
    return`<h1>Edit video</h1><div class="panel">${formH(v)}<button class="btn" data-act="edit" data-id="${id}">Save changes</button><a class="btn ghost" href="#/watch/${id}">Cancel</a></div>`;
  },
  async profile(){
    const L=await all(),pub=L.filter(v=>v.published&&v.visibility==="public"),th=await thumbs(pub);
    const ids=BM(),saved=ids.map(i=>DEMO.find(d=>d.id===i)||L.find(x=>x.id===i)).filter(Boolean),sth=await thumbs(saved.filter(v=>v.source==="user"));
    return`<div style="display:flex;gap:16px;align-items:center"><div class="av">${esc(ME.name[0])}</div><div><h1>${esc(ME.name)}</h1><p class="mut">Local profile. ${L.length} video${L.length===1?"":"s"}, ${fmtB(L.reduce((a,v)=>a+v.size,0))} stored. ${await estimate()}</p></div></div>
    <h2>Published videos</h2>${pub.length?`<div class="grid">${pub.map(v=>card(v,th[v.id])).join("")}</div>`:`<p class="mut">No published videos.</p>`}
    <h2>Saved for later</h2>${saved.length?`<div class="grid">${saved.map(v=>card(v,sth[v.id])).join("")}</div>`:`<p class="mut">Nothing saved.</p>`}`;
  }
};

/* ---------- Router ---------- */
let RT=0;
const go=h=>location.hash===h?render():location.hash=h;
async function render(){
  const my=++RT;freeURLs();
  const[route,arg]=(location.hash.slice(2)||"home").split("/");
  if(route!=="upload"&&U.s!=="STORING")resetU();
  let html;
  try{html=await(VIEWS[route]||VIEWS.home)(decodeURIComponent(arg||""))}catch(e){html=`<div class="msg err">${esc(errMsg(e))}</div>`}
  if(my!==RT)return;
  $("#app").innerHTML=shell(VIEWS[route]?route:"home",html);window.scrollTo(0,0);
}
addEventListener("hashchange",render);
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="FORM")return;const id=b.dataset.id;
  switch(b.dataset.act){
    case"dl":return download(id);
    case"del":return del(id);
    case"save":return saveVideo();
    case"pub":return publish();
    case"cancel":U.s==="VALIDATING"||U.s==="SELECTED"?toast("Cancelled."):0;return resetU(),ru();
    case"again":return resetU(),ru();
    case"bm":{const a=BM();setBM(a.includes(id)?a.filter(x=>x!==id):a.concat(id));return render()}
    case"edit":try{await VideoBackend.updateVideo(id,readForm());toast("Changes saved.");go("#/watch/"+id)}catch(x){toast(errMsg(x),1)}
  }
});
document.addEventListener("submit",e=>{if(e.target.dataset.act==="search"){e.preventDefault();go("#/search/"+encodeURIComponent($("#q").value))}});
document.addEventListener("change",e=>{if(e.target.id==="file"&&e.target.files[0])pick(e.target.files[0])});
document.addEventListener("dragover",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=e.target.closest&&e.target.closest("#drop");if(d){e.preventDefault();if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])}});
addEventListener("pagehide",freeURLs);
render();
</script>
</body>
</html>

<!DOCTYPE html>
<!--
VYDE — single-file frontend on a REAL centralized backend: Supabase Auth + Postgres + Storage.
Static hosting (GitHub Pages) serves this page only. All data lives in YOUR Supabase project.
Only the PUBLIC anon key is used here. NEVER put a service-role key in this file.
Row Level Security is what protects data, so run ALL of the SQL below once in Supabase > SQL Editor.
Also: Authentication > Providers > Email must be enabled. Storage max file size is set below (50 MB, free-tier limit).

create table public.profiles(id uuid primary key references auth.users(id) on delete cascade, username text not null, created_at timestamptz not null default now());
create table public.videos(
  id uuid primary key default gen_random_uuid(),
  owner_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  title text not null check(char_length(title) between 1 and 120),
  description text not null default '',
  category text, tags text[] not null default '{}',
  visibility text not null default 'public' check(visibility in ('public','private')),
  allow_comments boolean not null default true,
  status text not null default 'uploading' check(status in ('uploading','processing','ready','failed')),
  filename text, mime_type text, size bigint, duration real, width int, height int,
  original_path text not null, playback_path text, thumbnail_path text,
  created_at timestamptz not null default now(), updated_at timestamptz not null default now(),
  check(original_path like owner_id::text||'/'||id::text||'/%'),
  check(playback_path is null or playback_path like owner_id::text||'/'||id::text||'/%'),
  check(thumbnail_path is null or thumbnail_path like owner_id::text||'/'||id::text||'/%'));
create table public.comments(
  id uuid primary key default gen_random_uuid(),
  video_id uuid not null references public.videos(id) on delete cascade,
  user_id uuid not null default auth.uid() references public.profiles(id) on delete cascade,
  body text not null check(char_length(body) between 1 and 1000),
  created_at timestamptz not null default now());
create function public.handle_new_user() returns trigger language plpgsql security definer set search_path=public as $$
begin insert into public.profiles(id,username) values(new.id, coalesce(nullif(new.raw_user_meta_data->>'username',''), split_part(new.email,'@',1))); return new; end $$;
create trigger on_auth_user_created after insert on auth.users for each row execute function public.handle_new_user();
alter table public.profiles enable row level security;
alter table public.videos enable row level security;
alter table public.comments enable row level security;
create policy "profiles readable" on public.profiles for select using (true);
create policy "profile update own" on public.profiles for update using (id=auth.uid());
create policy "profile insert own" on public.profiles for insert with check (id=auth.uid());
create policy "videos read" on public.videos for select using ((visibility='public' and status='ready') or owner_id=auth.uid());
create policy "videos insert own" on public.videos for insert with check (owner_id=auth.uid());
create policy "videos update own" on public.videos for update using (owner_id=auth.uid()) with check (owner_id=auth.uid());
create policy "videos delete own" on public.videos for delete using (owner_id=auth.uid());
create policy "comments read" on public.comments for select using (exists(select 1 from public.videos v where v.id=video_id));
create policy "comments insert" on public.comments for insert with check (user_id=auth.uid() and exists(select 1 from public.videos v where v.id=video_id and v.allow_comments));
create policy "comments delete" on public.comments for delete using (user_id=auth.uid() or exists(select 1 from public.videos v where v.id=video_id and v.owner_id=auth.uid()));
insert into storage.buckets(id,name,public,file_size_limit) values('vyde','vyde',false,52428800) on conflict (id) do nothing;
create policy "files read own" on storage.objects for select using (bucket_id='vyde' and (storage.foldername(name))[1]=auth.uid()::text);
create policy "files read public" on storage.objects for select to anon, authenticated using (bucket_id='vyde' and exists(select 1 from public.videos v where v.visibility='public' and v.status='ready' and name in (coalesce(v.playback_path,v.original_path), v.thumbnail_path)));
create policy "files insert own" on storage.objects for insert to authenticated with check (bucket_id='vyde' and (storage.foldername(name))[1]=auth.uid()::text);
create policy "files update own" on storage.objects for update to authenticated using (bucket_id='vyde' and (storage.foldername(name))[1]=auth.uid()::text);
create policy "files delete own" on storage.objects for delete to authenticated using (bucket_id='vyde' and (storage.foldername(name))[1]=auth.uid()::text);

The CHECK constraints force every stored path into the owner's own folder, so nobody can point a public video at another user's file.
File layout in Storage: <userId>/<videoId>/original.<ext>, playback.webm, thumb.jpg. Originals stay private to the owner
whenever a playback version exists; public viewers only receive playback + thumbnail via short-lived signed URLs.
-->

<style>

a{color:inherit;text-decoration:none}p{margin:8px 0}.mut{color:var(--mut)}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.btn{display:inline-block;border:0;border-radius:999px;padding:10px 20px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1b0f08;font:600 14px system-ui;cursor:pointer;margin:6px 8px 6px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:transparent;color:var(--bad);border:1px solid #6b3530}.btn[disabled]{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(135deg,#4a2e1a,#170f0a);display:grid;place-items:center;color:var(--mut);font-size:12px}

.row{display:grid;grid-template-columns:150px 1fr;gap:16px;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);margin:12px 0}@media(max-width:600px){.row{grid-template-columns:100px 1fr}}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut)}.badge.ok{color:var(--ok);border-color:#3f6b4a}.badge.bad{color:var(--bad);border-color:#6b3530}
.player{aspect-ratio:16/9;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}.player video{width:100%;height:100%;display:block;background:#000}

dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:12px 0}dt{color:var(--mut)}dd{margin:0;word-break:break-all}
.form{display:grid;gap:12px;margin:14px 0;max-width:560px}label{display:grid;gap:4px;font-size:13px;color:var(--mut)}label.chk{display:flex;gap:8px;align-items:center}
input:not([type=checkbox]),textarea,select{background:#120c08;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;width:100%}
progress{width:100%;height:10px;accent-color:var(--acc)}.sf{display:flex;gap:8px;margin:16px 0 18px}
.msg{padding:10px 14px;border-radius:12px;margin:12px 0;border:1px solid var(--line)}.msg.ok{border-color:#3f6b4a;color:var(--ok)}.msg.err{border-color:#6b3530;color:var(--bad)}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--acc);display:inline-block;vertical-align:middle;margin-right:8px;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}

.cm{padding:12px 0;border-top:1px solid var(--line)}.cm p{margin:4px 0}

<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
"use strict";
/* ======================= CONFIGURATION — REPLACE THESE TWO VALUES ======================= */
const SUPABASE_URL="https://YOUR-PROJECT-REF.supabase.co";   // <-- your Supabase project URL
const SUPABASE_ANON_KEY="YOUR-PUBLIC-ANON-KEY";                // <-- PUBLIC anon key only. Never a service-role key.
const BUCKET="vyde", MAX_UPLOAD_MB=50;                         // keep MAX_UPLOAD_MB <= your Storage file size limit
/* ======================================================================================== */
const READY_CFG=!/YOUR-/.test(SUPABASE_URL+SUPABASE_ANON_KEY)&&typeof supabase!=="undefined";
const sb=READY_CFG?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtB=n=>{if(n==null)return"—";const u=["B","KB","MB","GB"];let i=0;while(n>=1024&&i<3){n/=1024;i++}return n.toFixed(i?1:0)+" "+u[i]};
const fmtD=s=>{if(!s)return"—";s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
const toast=(m,bad)=>{const t=$("#toast");t.textContent=m;t.style.display="block";t.style.color=bad?"var(--bad)":"var(--ink)";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",4000)};
const errMsg=e=>(e&&(e.message||e.error_description||e.error))||"Unknown error.";
const CATS=["Entertainment","Education","Music","Travel","Food","Sports","Gaming","Other"];
let ME=null,AUTHMODE="in";
const canManage=v=>ME&&v.owner_id===ME.id;

async function ensureProfile(){if(!ME)return;try{await sb.from("profiles").upsert({id:ME.id,username:(ME.user_metadata&&ME.user_metadata.username)||(ME.email||"user").split("@")[0]},{onConflict:"id",ignoreDuplicates:true})}catch{}}

/* ---------- Data access (all through Supabase; RLS enforces ownership server-side) ---------- */
const SEL="*, profiles(username)";
async function sign(paths,ttl=3600){paths=[...new Set(paths.filter(Boolean))];if(!paths.length)return{};
  const{data,error}=await sb.storage.from(BUCKET).createSignedUrls(paths,ttl);if(error)throw error;
  const m={};data.forEach(x=>{if(x.signedUrl)m[x.path]=x.signedUrl});return m}
async function listPublic(q){
  let r=sb.from("videos").select(SEL).eq("status","ready").eq("visibility","public").order("created_at",{ascending:false}).limit(60);
  const s=(q||"").replace(/[,()%*]/g," ").trim();if(s)r=r.or(`title.ilike.%${s}%,description.ilike.%${s}%`);
  const{data,error}=await r;if(error)throw error;return data}
async function destroy(id){ // permanently removes ALL stored files, verifies they are gone, then removes the database row
  const dir=`${ME.id}/${id}`,st=sb.storage.from(BUCKET);
  await sb.from("videos").update({status:"failed"}).eq("id",id); // hide from public viewers before the files disappear
  const{data:fl,error:e1}=await st.list(dir);if(e1)throw e1;
  if(fl.length){const{error}=await st.remove(fl.map(x=>`${dir}/${x.name}`));if(error)throw error}
  const{data:left,error:e2}=await st.list(dir);if(e2)throw e2;
  if(left.length)throw new Error("Some stored files could not be removed. Try again.");
  const{data:gone,error}=await sb.from("videos").delete().eq("id",id).select("id");if(error)throw error;
  if(!gone.length){const{data:c}=await sb.from("videos").select("id").eq("id",id).maybeSingle();if(c)throw new Error("The database record was not deleted (not permitted).")}}
async function put(path,blob,onp){ // real byte-level progress via XHR to the Storage REST endpoint, authenticated with the user's JWT
  const{data:{session}}=await sb.auth.getSession();if(!session)throw new Error("You are signed out. Sign in and retry.");
  return new Promise((ok,no)=>{const x=new XMLHttpRequest();
    x.open("POST",`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path.split("/").map(encodeURIComponent).join("/")}`);
    x.setRequestHeader("Authorization","Bearer "+session.access_token);x.setRequestHeader("apikey",SUPABASE_ANON_KEY);
    x.setRequestHeader("x-upsert","true");x.setRequestHeader("Content-Type",blob.type||"application/octet-stream");
    x.upload.onprogress=e=>e.lengthComputable&&onp&&onp(e.loaded,e.total);
    x.onload=()=>{if(x.status<300)return ok();let m="Storage rejected the upload ("+x.status+").";try{m=JSON.parse(x.responseText).message||m}catch{}no(new Error(m))};
    x.onerror=()=>no(new Error("Network error during upload."));x.onabort=()=>no(new Error("Upload cancelled."));
    U.xhr=x;x.send(blob)})}

/* ---------- Validation, metadata, thumbnail (real media APIs) ---------- */
const EXT=/\.(mp4|m4v|mov|webm|ogv|ogg|mkv)$/i;
function validate(f){
  if(!(f instanceof File))return"No file was selected.";
  if(f.size===0)return"This file is empty (0 bytes).";
  if(!EXT.test(f.name))return"Unsupported extension. Use MP4, M4V, MOV, WebM, OGV or MKV.";
  if(f.type&&!f.type.startsWith("video/"))return`This file is not a video (type: ${f.type}).`;
  if(f.size>MAX_UPLOAD_MB*1048576)return`This file is ${fmtB(f.size)}. The upload limit is ${MAX_UPLOAD_MB} MB.`;
  return null}
function probe(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),v=document.createElement("video");let info=null,t;
  v.preload="metadata";v.muted=true;v.playsInline=true;
  const done=(f,x)=>{clearTimeout(t);v.onerror=v.onloadedmetadata=v.onseeked=null;v.removeAttribute("src");v.load();URL.revokeObjectURL(url);f(x)};
  t=setTimeout(()=>info?done(res,{...info,thumb:null}):done(rej,new Error("Timed out while reading video metadata.")),20000);
  v.onerror=()=>done(rej,new Error("The browser cannot read this file as a video."));
  v.onloadedmetadata=()=>{if(!v.videoWidth)return done(rej,new Error("No video track found in this file."));
    const d=isFinite(v.duration)?v.duration:0;info={duration:d,width:v.videoWidth,height:v.videoHeight};v.currentTime=d>0?Math.min(Math.max(d*.1,.1),d/2):0};
  v.onseeked=()=>{const c=document.createElement("canvas"),k=Math.min(1,640/v.videoWidth);c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    try{c.getContext("2d").drawImage(v,0,0,c.width,c.height);c.toBlob(b=>done(res,{...info,thumb:b||null}),"image/jpeg",.82)}catch{done(res,{...info,thumb:null})}};
  v.src=url})}

/* ---------- Real browser-side compression (720p re-encode via canvas + MediaRecorder; runs in real time) ---------- */
const canCompress=()=>!!(window.MediaRecorder&&HTMLCanvasElement.prototype.captureStream&&window.AudioContext);
function transcode(file,info,onp){return new Promise((ok,no)=>{
  const MR=window.MediaRecorder,mime=["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"].find(t=>MR.isTypeSupported(t));
  if(!mime)return no(new Error("No supported recording format."));
  const url=URL.createObjectURL(file),v=document.createElement("video"),k=Math.min(1,720/info.height),c=document.createElement("canvas"),g=c.getContext("2d"),chunks=[];
  c.width=Math.round(info.width*k/2)*2;c.height=Math.round(info.height*k/2)*2;v.src=url;v.playsInline=true;
  let ac,rec,raf,dead=false;
  const vis=()=>{if(dead||!rec)return;if(document.hidden){v.pause();if(rec.state==="recording")rec.pause()}else{if(rec.state==="paused")rec.resume();v.play().catch(()=>{})}};
  document.addEventListener("visibilitychange",vis);
  const end=(f,x)=>{if(dead)return;dead=true;document.removeEventListener("visibilitychange",vis);cancelAnimationFrame(raf);try{rec&&rec.state!=="inactive"&&rec.stop()}catch{}v.pause();v.removeAttribute("src");v.load();URL.revokeObjectURL(url);ac&&ac.close().catch(()=>{});f(x)};
  U.abortT=()=>end(no,new Error("skipped"));
  v.onerror=()=>end(no,new Error("The browser could not decode this video for compression."));
  v.onended=()=>{rec.onstop=()=>end(ok,new Blob(chunks,{type:mime.split(";")[0]}));rec.stop()};
  v.onloadedmetadata=async()=>{try{
    ac=new AudioContext();await ac.resume();const d=ac.createMediaStreamDestination();ac.createMediaElementSource(v).connect(d);
    const st=c.captureStream(30);d.stream.getAudioTracks().forEach(t=>st.addTrack(t));
    rec=new MR(st,{mimeType:mime,videoBitsPerSecond:2500000,audioBitsPerSecond:128000});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
    const draw=()=>{g.drawImage(v,0,0,c.width,c.height);onp(v.currentTime/info.duration);raf=requestAnimationFrame(draw)};
    rec.start(1000);await v.play();draw()}catch(e){end(no,e)}}})}

/* ---------- Shared UI ---------- */
const NAV=[["home","Home"],["search","Search"],["upload","Upload"],["my","My videos"],["profile","Profile"]];
const acct=()=>ME?`<span>${esc(ME.user_metadata?.username||ME.email)}</span><a class="btn ghost" style="margin:0;padding:6px 14px" href="#/profile">Profile</a><button class="btn ghost" style="margin:0;padding:6px 14px" data-act="signout">Sign out</button>`:`<a class="btn" style="margin:0;padding:6px 14px" href="#/auth">Sign in</a>`;
const shell=(r,h)=>`<div class="app"><nav class="side"><div class="logo">VYDE</div>${NAV.map(n=>`<a href="#/${n[0]}" class="${r===n[0]?"on":""}">${n[1]}</a>`).join("")}</nav><main><div class="acct">${acct()}</div>${h}</main></div><nav class="bot">${NAV.map(n=>`<a href="#/${n[0]}" class="${r===n[0]?"on":""}">${n[1]}</a>`).join("")}</nav>`;
const loadingH=`<p class="mut"><span class="spin"></span>Loading…</p>`;
const notFound=()=>`<div class="empty"><h2>Video not found</h2><p class="mut">It may have been deleted, or it is private.</p><a class="btn" href="#/home">Back to Home</a></div>`;
const needAuth=w=>`<div class="empty"><h2>Sign in to ${w}</h2><a class="btn" href="#/auth">Sign in or create an account</a></div>`;
const card=(v,m)=>`<a class="card" href="#/watch/${v.id}"><div class="th">${m[v.thumbnail_path]?`<img src="${m[v.thumbnail_path]}" alt="" loading="lazy">`:"No preview"}${v.duration?`<b class="dur">${fmtD(v.duration)}</b>`:""}</div><h3>${esc(v.title)}</h3><p>${esc(v.profiles?.username||"Unknown")}${v.category?", "+esc(v.category):""}</p></a>`;
const grid=(L,m,empty)=>L.length?`<div class="grid">${L.map(v=>card(v,m)).join("")}</div>`:`<p class="mut">${empty}</p>`;
const formH=f=>`<div class="form"><label>Title<input id="f-title" maxlength="120" value="${esc(f.title)}"></label>
<label>Description<textarea id="f-desc" rows="3">${esc(f.description)}</textarea></label>
<label>Category<select id="f-cat">${CATS.map(c=>`<option ${c===f.category?"selected":""}>${c}</option>`).join("")}</select></label>
<label>Tags (comma separated)<input id="f-tags" value="${esc((f.tags||[]).join(", "))}"></label>
<label>Visibility<select id="f-vis"><option value="public" ${f.visibility!=="private"?"selected":""}>Public: everyone can watch once ready</option><option value="private" ${f.visibility==="private"?"selected":""}>Private: only you</option></select></label>
<label class="chk"><input type="checkbox" id="f-com" ${f.allow_comments!==false?"checked":""}> Allow comments</label></div>`;
const readForm=()=>({title:($("#f-title").value.trim()||"Untitled video").slice(0,120),description:$("#f-desc").value.trim(),category:$("#f-cat").value,tags:$("#f-tags").value.split(",").map(s=>s.trim()).filter(Boolean),visibility:$("#f-vis").value,allow_comments:$("#f-com").checked});
const actions=v=>`<a class="btn" href="#/watch/${v.id}">Watch</a>${canManage(v)?`<button class="btn ghost" data-act="dl" data-id="${v.id}">Download Original</button><a class="btn ghost" href="#/edit/${v.id}">Edit</a><button class="btn danger" data-act="del" data-id="${v.id}">Delete</button>`:""}`;

/* ---------- Upload pipeline: real states only ---------- */
let U={s:"IDLE",tok:Symbol()};
const STEPS=["Choose file","Selected","Analyzing","Uploading","Processing","Ready"];
const IDX={IDLE:0,SELECTED:1,VALIDATING:2,VALIDATION_ERROR:0,ANALYZED:3,UPLOADING:3,PROCESSING:4,FAILED:3,READY:6};
function resetU(){if(U.thumbURL)URL.revokeObjectURL(U.thumbURL);U={s:"IDLE",tok:Symbol()}}
const ru=()=>{const el=$("#ub");if(el)el.innerHTML=uploadH()};
function uploadH(){
  const i=IDX[U.s],f=U.file,st=`<ol class="steps">${STEPS.map((s,k)=>`<li class="${k<i?"done":k===i?"on":""}">${s}</li>`).join("")}</ol>`,err=U.err?`<div class="msg err" role="alert">${esc(U.err)}</div>`:"";
  if(U.s==="IDLE"||U.s==="VALIDATION_ERROR")return st+err+`<label class="drop" id="drop"><input type="file" id="file" accept="video/*,.mkv,.mov"><div><h3>Choose a video file</h3><p class="mut">Drop a file here or tap to browse. Up to ${MAX_UPLOAD_MB} MB.</p></div></label>`;
  if(U.s==="SELECTED"||U.s==="VALIDATING")return st+`<p><span class="spin"></span>Analyzing video: ${esc(f.name)}</p><button class="btn ghost" data-act="cancel">Cancel</button>`;
  const th=U.thumbURL?`<div class="th" style="max-width:360px"><img src="${U.thumbURL}" alt="Frame from your video"></div>`:`<p class="mut">No preview frame could be extracted.</p>`;
  if(U.s==="ANALYZED"){const cc=canCompress()&&U.duration>0;
    return st+th+`<dl><dt>Filename</dt><dd>${esc(f.name)}</dd><dt>Size</dt><dd>${fmtB(f.size)}</dd><dt>Type</dt><dd>${esc(f.type||"not reported")}</dd><dt>Duration</dt><dd>${U.duration?fmtD(U.duration):"not reported"}</dd><dt>Dimensions</dt><dd>${U.width}×${U.height}</dd></dl>`+formH(U.form||{title:U.title,tags:[],visibility:"public",category:CATS[0],allow_comments:true,description:""})+
    `<label class="chk"><input type="checkbox" id="f-cmp" ${cc?"":"disabled"} ${cc&&(U.height>720||f.size>40e6)?"checked":""}> Also create a compressed 720p web version (takes about as long as the video plays; it pauses while this tab is hidden)</label>${cc?"":`<p class="mut">Browser-side compression is unavailable. The original will be used for playback.</p>`}<button class="btn" data-act="save">Upload video</button><button class="btn ghost" data-act="cancel">Choose a different file</button>`}
  if(U.s==="UPLOADING"){const p=U.prog,pc=p?Math.round(p.l/p.t*100):0;return st+`<p><span class="spin"></span>${esc(U.stage||"Preparing upload")}${p?`: ${fmtB(p.l)} of ${fmtB(p.t)} (${pc}%)`:""}</p><progress max="100" value="${pc}"></progress><button class="btn ghost" data-act="abort">Cancel upload</button>`}
  if(U.s==="PROCESSING")return st+`<p><span class="spin"></span>Creating compressed web version… it pauses while this tab is hidden.</p><progress id="tp" max="1" value="${U.tp||0}"></progress><p class="mut">Your original file is already uploaded.</p><button class="btn ghost" data-act="skip">Skip compression</button>`;
  if(U.s==="FAILED")return st+err+`<p class="mut">Nothing is marked as published until every step succeeds.</p><button class="btn" data-act="retry">Retry</button><button class="btn danger" data-act="discard">Discard and remove partial upload</button>`;
  const pub=U.rec.visibility==="public";
  return st+`<div class="msg ok">${pub?"Uploaded to VYDE. It is now available to everyone.":"Uploaded to VYDE as private. Only you can see it."}</div>${U.note?`<p class="mut">${esc(U.note)}</p>`:""}${th}${actions(U.rec)}<button class="btn ghost" data-act="again">Upload another</button>`}
async function pick(file){
  resetU();const tok=U.tok;U.file=file;U.s="SELECTED";ru();
  const e=validate(file);if(e){U.s="VALIDATION_ERROR";U.err=e;return ru()}
  U.s="VALIDATING";ru();
  try{const info=await probe(file);if(U.tok!==tok)return;Object.assign(U,info,{s:"ANALYZED",thumbURL:info.thumb?URL.createObjectURL(info.thumb):null,title:file.name.replace(/\.[^.]+$/,"")});ru()}
  catch(x){if(U.tok===tok){U.s="VALIDATION_ERROR";U.err=errMsg(x);ru()}}}
async function run(){
  const f=U.file,d=U.d||(U.d={id:crypto.randomUUID()}),base=`${ME.id}/${d.id}/`,ext=(f.name.match(/\.[^.]+$/)||[".mp4"])[0].toLowerCase(),op=base+"original"+ext;
  try{
    U.s="UPLOADING";U.err=null;U.prog=null;U.stage="Creating record";ru();
    if(!d.row){const{error}=await sb.from("videos").insert({id:d.id,...U.form,filename:f.name,mime_type:f.type||null,size:f.size,duration:U.duration,width:U.width,height:U.height,original_path:op,status:"uploading"});if(error)throw error;d.row=1}else await sb.from("videos").update({status:"uploading"}).eq("id",d.id);
    if(U.thumb&&!d.thumb){U.stage="Uploading thumbnail";ru();await put(base+"thumb.jpg",U.thumb);d.thumb=1}
    if(!d.orig){U.stage="Uploading original";ru();await put(op,f,(l,t)=>{U.prog={l,t};ru()});d.orig=1}
    if(U.compress&&!U.skip&&!d.pblob){U.s="PROCESSING";U.tp=0;ru();await sb.from("videos").update({status:"processing"}).eq("id",d.id);
      try{d.pblob=await transcode(f,U,x=>{U.tp=x;const p=$("#tp");if(p)p.value=x})}
      catch(e){U.skip=true;if(e.message!=="skipped")U.note="Compression failed ("+e.message+"). The original is used for playback."}}
    if(d.pblob&&!d.pp){U.s="UPLOADING";U.stage="Uploading web playback version";U.prog=null;ru();const pp=base+"playback."+(d.pblob.type.includes("mp4")?"mp4":"webm");await put(pp,d.pblob,(l,t)=>{U.prog={l,t};ru()});d.pp=pp}
    U.stage="Verifying stored files";U.prog=null;ru();
    const{data:fl,error:le}=await sb.storage.from(BUCKET).list(`${ME.id}/${d.id}`);if(le)throw le;
    const have=new Set(fl.map(x=>x.name));
    if(!have.has("original"+ext)||(d.thumb&&!have.has("thumb.jpg"))||(d.pp&&!have.has(d.pp.split("/").pop())))throw new Error("Storage verification failed: an uploaded file was not found. Retry the upload.");
    const{data,error}=await sb.from("videos").update({status:"ready",playback_path:d.pp||null,thumbnail_path:d.thumb?base+"thumb.jpg":null,updated_at:new Date().toISOString()}).eq("id",d.id).select().single();
    if(error)throw error;U.rec=data;U.s="READY";ru()
  }catch(e){U.s="FAILED";U.err=errMsg(e);ru();if(d.row)sb.from("videos").update({status:"failed"}).eq("id",d.id).then(()=>{},()=>{})}}

/* ---------- Comments (refreshed in place so the video keeps playing) ---------- */
let CUR=null;
async function commentsH(v){
  if(!v.allow_comments)return`<p class="mut">Comments are turned off.</p>`;
  const{data:C,error}=await sb.from("comments").select("*, profiles(username)").eq("video_id",v.id).order("created_at",{ascending:false});if(error)throw error;
  return`<h2>Comments (${C.length})</h2>${ME?`<form class="sf" data-act="comment" data-id="${v.id}"><input id="cb" maxlength="1000" placeholder="Add a comment" required><button class="btn" style="margin:0">Post</button></form>`:`<p class="mut"><a href="#/auth" style="color:var(--acc)">Sign in</a> to comment.</p>`}${C.map(c=>`<div class="cm"><b>${esc(c.profiles?.username||"Unknown")}</b> <span class="mut">${new Date(c.created_at).toLocaleString()}</span><p>${esc(c.body)}</p>${ME&&(c.user_id===ME.id||canManage(v))?`<button class="btn ghost" style="padding:4px 12px;margin:0" data-act="delc" data-id="${c.id}">Delete</button>`:""}</div>`).join("")}`}
const refreshC=async()=>{const el=$("#cmts");if(el&&CUR)el.innerHTML=await commentsH(CUR)};

/* ---------- Views ---------- */
const VIEWS={
  async home(){const L=await listPublic(),m=await sign(L.map(v=>v.thumbnail_path));
    return`<section class="hero"><h1>Watch what everyone shares.</h1><p>Every public video here is stored in the cloud and visible on any device.</p><a class="btn" href="#/upload">Upload a video</a></section><h2>Latest videos</h2>${grid(L,m,"No public videos yet. Be the first to upload one.")}`},
  async search(q){const L=await listPublic(q),m=await sign(L.map(v=>v.thumbnail_path));
    return`<h1>Search</h1><form class="sf" data-act="search"><input id="q" type="search" placeholder="Titles and descriptions" value="${esc(q)}"><button class="btn" style="margin:0">Search</button></form>${grid(L,m,q?`No videos match "${esc(q)}".`:"No public videos yet.")}`},
  async upload(){return ME?`<h1>Upload a video</h1><p class="mut">Files go to VYDE cloud storage. You must stay signed in until it finishes.</p><div class="panel" id="ub">${uploadH()}</div>`:needAuth("upload")},
  async my(){if(!ME)return needAuth("see your videos");
    const{data:L,error}=await sb.from("videos").select(SEL).eq("owner_id",ME.id).order("created_at",{ascending:false});if(error)throw error;
    const m=await sign(L.map(v=>v.thumbnail_path));
    return`<h1>My videos</h1>`+(L.length?L.map(v=>`<div class="row"><div class="th">${m[v.thumbnail_path]?`<img src="${m[v.thumbnail_path]}" alt="">`:"No preview"}</div><div><h3>${esc(v.title)}</h3><p class="mut">${esc(v.filename)}, ${fmtB(v.size)}</p><span class="badge ${v.status==="ready"?"ok":"bad"}">${v.status==="ready"?(v.visibility==="public"?"Published":"Private"):v.status==="failed"?"Failed":"Incomplete upload ("+v.status+")"}</span><div>${v.status==="ready"?actions(v):`<button class="btn danger" data-act="del" data-id="${v.id}">Delete</button>`}</div></div></div>`).join(""):`<div class="empty"><p class="mut">You haven't uploaded anything.</p><a class="btn" href="#/upload">Upload a video</a></div>`)},
  async watch(id){
    const{data:v,error}=await sb.from("videos").select(SEL).eq("id",id).maybeSingle();if(error)throw error;if(!v)return notFound();
    let body;
    if(v.status!=="ready")body=`<div class="unavail"><div><h3>Video file is unavailable.</h3><p>This upload is not finished (${esc(v.status)}).</p></div></div>`;
    else{const key=v.playback_path||v.original_path,m=await sign([key,v.thumbnail_path],21600);
      body=m[key]?`<div class="player"><video controls playsinline preload="metadata" src="${m[key]}" ${m[v.thumbnail_path]?`poster="${m[v.thumbnail_path]}"`:""} onloadedmetadata="if(this.duration===Infinity){this.currentTime=1e101;this.ontimeupdate=()=>{this.ontimeupdate=null;this.currentTime=0}}" onerror="vidErr(this)"></video></div>`:`<div class="unavail"><div><h3>Video file is unavailable.</h3><p>The file could not be loaded from storage.</p></div></div>`}
    CUR=v;const cm=`<section id="cmts">${await commentsH(v)}</section>`;
    return`${body}<h1 style="margin-top:18px">${esc(v.title)}</h1><p><a class="badge" href="#/profile/${v.owner_id}">${esc(v.profiles?.username||"Unknown")}</a> <span class="badge">${esc(v.category||"")}</span> ${v.visibility==="private"?`<span class="badge bad">Private</span>`:""}</p><p>${esc(v.description)}</p>${(v.tags||[]).length?`<p class="mut">Tags: ${esc(v.tags.join(", "))}</p>`:""}
    <dl><dt>Duration</dt><dd>${fmtD(v.duration)}</dd><dt>Resolution</dt><dd>${v.width}×${v.height}</dd><dt>Uploaded</dt><dd>${new Date(v.created_at).toLocaleString()}</dd>${canManage(v)?`<dt>Original</dt><dd>${esc(v.filename)}, ${fmtB(v.size)}</dd><dt>Playback</dt><dd>${v.playback_path?"Compressed web version":"Original file"}</dd>`:""}</dl><div>${canManage(v)?actions(v):""}</div>${cm}`},
  async edit(id){if(!ME)return needAuth("edit");const{data:v,error}=await sb.from("videos").select("*").eq("id",id).maybeSingle();if(error)throw error;if(!v||!canManage(v))return notFound();
    return`<h1>Edit video</h1><div class="panel">${formH(v)}<button class="btn" data-act="edit" data-id="${id}">Save changes</button><a class="btn ghost" href="#/watch/${id}">Cancel</a></div>`},
  async profile(id){id=id||(ME&&ME.id);if(!id)return needAuth("see your profile");
    const{data:p,error}=await sb.from("profiles").select("*").eq("id",id).maybeSingle();if(error)throw error;if(!p)return`<div class="empty"><h2>Profile not found</h2></div>`;
    const{data:L,error:e2}=await sb.from("videos").select(SEL).eq("owner_id",id).eq("status","ready").eq("visibility","public").order("created_at",{ascending:false});if(e2)throw e2;const m=await sign(L.map(v=>v.thumbnail_path));
    return`<div style="display:flex;gap:16px;align-items:center"><div class="av">${esc(p.username[0]||"?")}</div><div><h1>${esc(p.username)}</h1><p class="mut">${L.length} public video${L.length===1?"":"s"}</p></div></div><h2>Videos</h2>${grid(L,m,"No public videos yet.")}`},
  async auth(){if(ME)return`<div class="empty"><h2>You're signed in</h2><a class="btn" href="#/home">Go Home</a></div>`;const up=AUTHMODE==="up";
    return`<h1>${up?"Create your account":"Sign in"}</h1><form class="form" data-act="auth">${up?`<label>Username<input id="a-name" required maxlength="30"></label>`:""}<label>Email<input id="a-email" type="email" required autocomplete="email"></label><label>Password<input id="a-pass" type="password" required minlength="6" autocomplete="${up?"new-password":"current-password"}"></label><div><button class="btn">${up?"Create account":"Sign in"}</button><button type="button" class="btn ghost" data-act="mode">${up?"I already have an account":"Create an account"}</button></div></form>`}
};
window.vidErr=el=>{const d=document.createElement("div");d.className="unavail";d.textContent="This browser can't play this file. If you own it, download the original to open it elsewhere.";el.replaceWith(d)};

/* ---------- Router ---------- */
let RT=0;const go=h=>location.hash===h?render():location.hash=h;
async function render(){
  const my=++RT,[route,arg]=(location.hash.slice(2)||"home").split("/"),r=VIEWS[route]?route:"home";
  if(!READY_CFG){$("#app").innerHTML=shell(r,(typeof supabase==="undefined"?`<div class="msg err" role="alert">The Supabase client library did not load from the CDN. Check your connection or content blocker.</div>`:"")+`<div class="panel"><h2 style="margin-top:0">Supabase is not configured</h2><p>Open <b>index.html</b>, set <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> at the top of the script, and run the SQL from the comment at the top of the file in your Supabase SQL Editor. Until then VYDE has no backend, so it shows no videos and accepts no uploads.</p></div>`);return}
  if(r!=="upload"&&U.s!=="UPLOADING"&&U.s!=="PROCESSING")resetU();
  const mn=$("main");if(mn)mn.innerHTML=`<div class="acct">${acct()}</div>${loadingH}`;else $("#app").innerHTML=shell(r,loadingH);
  let html;try{html=await VIEWS[r](decodeURIComponent(arg||""))}catch(e){html=`<div class="msg err" role="alert">${esc(errMsg(e))}</div><button class="btn" data-act="reload">Retry</button>`}
  if(my!==RT)return;$("#app").innerHTML=shell(r,html);window.scrollTo(0,0)}
addEventListener("hashchange",render);

/* ---------- Events ---------- */
async function busy(b,txt,fn){const t=b.textContent;b.disabled=true;b.textContent=txt;try{await fn()}catch(e){toast(errMsg(e),1)}finally{b.disabled=false;b.textContent=t}}
document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-act]");if(!b||b.tagName==="FORM")return;const id=b.dataset.id;
  switch(b.dataset.act){
    case"save":{const cmp=$("#f-cmp");U.form=readForm();U.compress=!!(cmp&&cmp.checked);U.skip=false;return run()}
    case"retry":return run();
    case"abort":return U.xhr&&U.xhr.abort();
    case"skip":U.skip=true;return U.abortT&&U.abortT();
    case"cancel":case"again":return resetU(),ru();
    case"discard":return busy(b,"Removing…",async()=>{if(U.d&&U.d.row)await destroy(U.d.id);resetU();ru();toast("Partial upload removed.")});
    case"dl":return busy(b,"Preparing…",async()=>{const{data:v,error}=await sb.from("videos").select("original_path,filename").eq("id",id).single();if(error)throw error;
      const{data,error:e2}=await sb.storage.from(BUCKET).createSignedUrl(v.original_path,120,{download:v.filename});if(e2)throw e2;
      const a=document.createElement("a");a.href=data.signedUrl;a.download=v.filename;document.body.appendChild(a);a.click();a.remove()});
    case"del":{if(!confirm("Permanently delete this video, its original file, playback version, thumbnail and comments? This cannot be undone."))return;
      return busy(b,"Deleting…",async()=>{await destroy(id);if(U.rec&&U.rec.id===id)resetU();toast("Video deleted permanently.");go("#/my")})}
    case"edit":return busy(b,"Saving…",async()=>{const{error}=await sb.from("videos").update({...readForm(),updated_at:new Date().toISOString()}).eq("id",id);if(error)throw error;toast("Changes saved.");go("#/watch/"+id)});
    case"delc":return busy(b,"Deleting…",async()=>{const{error}=await sb.from("comments").delete().eq("id",id);if(error)throw error;await refreshC()});
    case"mode":AUTHMODE=AUTHMODE==="up"?"in":"up";return render();
    case"signout":await sb.auth.signOut();return;
    case"reload":return render();
  }});
document.addEventListener("submit",async e=>{
  const a=e.target.dataset.act;if(!a)return;e.preventDefault();const btn=e.target.querySelector("button:not([type=button])");
  if(a==="search")return go("#/search/"+encodeURIComponent($("#q").value));
  if(a==="comment")return busy(btn,"Posting…",async()=>{const{error}=await sb.from("comments").insert({video_id:e.target.dataset.id,body:$("#cb").value.trim()});if(error)throw error;await refreshC()});
  if(a==="auth")return busy(btn,"Please wait…",async()=>{const email=$("#a-email").value.trim(),password=$("#a-pass").value;
    if(AUTHMODE==="up"){const{data,error}=await sb.auth.signUp({email,password,options:{data:{username:$("#a-name").value.trim()}}});if(error)throw error;
      if(!data.session){toast("Check your email to confirm your account, then sign in.");AUTHMODE="in";return render()}}
    else{const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error}
    go("#/home")})});
document.addEventListener("change",e=>{if(e.target.id==="file"&&e.target.files[0])pick(e.target.files[0])});
const dz=e=>e.target.closest&&e.target.closest("#drop");
document.addEventListener("dragover",e=>{const d=dz(e);if(d){e.preventDefault();d.classList.add("over")}});
document.addEventListener("dragleave",e=>{const d=dz(e);if(d)d.classList.remove("over")});
document.addEventListener("drop",e=>{const d=dz(e);if(d){e.preventDefault();if(e.dataTransfer.files[0])pick(e.dataTransfer.files[0])}});
addEventListener("beforeunload",e=>{if(U.s==="UPLOADING"||U.s==="PROCESSING"){e.preventDefault();e.returnValue=""}});

/* ---------- Boot ---------- */
(async()=>{
  if(READY_CFG){
    try{const{data}=await sb.auth.getSession();ME=data.session?data.session.user:null;ensureProfile()}catch{}
    sb.auth.onAuthStateChange((_ev,s)=>{const n=s?s.user:null;if((n&&n.id)!==(ME&&ME.id)){ME=n;setTimeout(ensureProfile,0);render()}else ME=n});
  }
  render();
})();
</script>
</body>
</html>

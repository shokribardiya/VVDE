<html lang="en">

<title>OBLIVION COMMAND</title>
<style>
:root{--bg:#0b0a09;--p1:#141210;--p2:#1c1916;--ln:#2e2822;--cu:#c07a45;--br:#6b3f24;--iv:#eee6d6;--mu:#9a8f80;--bad:#c4553b;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--iv);font:14px/1.45 system-ui,sans-serif;display:flex;flex-direction:column}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;font-weight:500;margin:0}
.id,td.id,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--cu)}
a{color:var(--cu)}button,input,select,textarea{font:inherit;color:var(--iv);background:var(--p2);border:1px solid var(--ln);border-radius:2px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--cu)}button.pri{background:var(--br);border-color:var(--cu)}
:focus-visible{outline:2px solid var(--cu);outline-offset:1px}

.scroll{overflow:auto;flex:1}
table{width:100%;border-collapse:collapse}th{text-align:left;font-weight:500;color:var(--mu);border-bottom:1px solid var(--ln);padding:6px 8px;position:sticky;top:0;background:var(--bg)}

.b{font-size:11px;padding:1px 6px;border:1px solid var(--ln);border-radius:2px}.b-PENDING{color:var(--cu);border-color:var(--cu)}.b-CONFIRMED{color:var(--iv);border-color:var(--iv)}.b-FAILED{color:var(--bad);border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln)}

.gwrap{position:relative;flex:1;min-height:320px;border:1px solid var(--ln);background:radial-gradient(circle at 50% 40%,#1a1512,#0b0a09 70%)}.gcv{width:100%;height:100%;display:block;touch-action:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button.off{opacity:.4}
.ov{position:fixed;inset:0;background:#000a;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh;z-index:20}
.pal{width:min(640px,94vw);background:var(--p1);border:1px solid var(--cu)}.pal input{width:100%;border:0;border-bottom:1px solid var(--ln);padding:12px}

.term-in{width:100%}.tabs{display:flex;gap:2px;flex-wrap:wrap}.tabs button.on{background:var(--br)}
.art{border-bottom:1px solid var(--ln);padding:14px 0;max-width:72ch}.hero{max-width:60ch;padding:24px 0}.hero h1{font-size:34px;line-height:1.15}

#app{flex-direction:column}nav{order:2;width:100%;display:flex;overflow-x:auto;border:0;border-top:1px solid var(--ln);padding:0}

}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<header id="hdr"></header><div id="warn"></div>
<div id="app"><nav id="nav" aria-label="Views"></nav><main id="main"></main><aside id="insp" aria-label="Object inspector"></aside></div>
<div id="toasts" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ============ Config (public values only — never put secrets here) ============ */
const CONFIG={
  api:'',            // e.g. 'https://ops.example.org' — backend origin; empty = local-only mode
  ws:'', sse:'',     // realtime endpoints; if empty and api set, polling /api/events is used
  loginUrl:'',       // where to send unauthenticated users (Cloudflare Access / OIDC / OTP)
  github:{repos:[]}, // public repos as 'owner/name'
  pollMs:15000
};
/* ============ Core helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const h=(t,p,...c)=>{const e=document.createElement(t);for(const k in p||{}){const v=p[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v)}for(const x of c.flat(9))if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(String(x)));return e};
const now=()=>new Date().toISOString(),fmt=t=>t?new Date(t).toLocaleString():'';
const hash=s=>{let x=2166136261;for(let i=0;i<s.length;i++){x^=s.charCodeAt(i);x=Math.imul(x,16777619)}return(x>>>0).toString(16).padStart(8,'0')};
const empty=m=>h('div',{class:'empty'},m),badge=s=>h('span',{class:'b b-'+s},s);
const S={objects:{},rels:[],audit:[],notifs:[],seq:{},fav:[],gh:{},cfg:{},layout:{},view:'command',sel:null,session:null,csrf:'',rt:'OFF',api:CONFIG.api?'UNKNOWN':'NOT CONFIGURED',online:navigator.onLine,filter:{},gmode:'GRAPH',gtypes:null,ptab:'home',term:[],msgs:[],integ:null,storageOk:true,frame:0};
/* ============ Errors & toasts ============ */
function toast(m,k){const t=h('div',{class:'toast '+(k||'')},m);$('#toasts').append(t);setTimeout(()=>t.remove(),6500)}
const Err={show(cat,msg,fix){toast(cat+': '+msg+(fix?' — '+fix:''),'err');if(['NETWORK','STORAGE','INTEGRATION'].includes(cat))Notif.push('SYSTEM_ERROR',null,cat+': '+msg)}};
/* ============ Storage ============ */
const Storage={k:'oblivion.command.v1',keys:['objects','rels','audit','notifs','seq','fav','gh','cfg','layout'],
  load(){try{const d=JSON.parse(localStorage.getItem(this.k)||'null');if(d)for(const k of this.keys)if(d[k])S[k]=d[k]}catch(e){S.storageOk=false}},
  save(){try{const d={};for(const k of this.keys)d[k]=S[k];localStorage.setItem(this.k,JSON.stringify(d));S.storageOk=true}catch(e){S.storageOk=false;Err.show('STORAGE','Local storage unavailable','export data and free browser storage')}}};
/* ============ Permissions ============ */
const ROLES={ADMIN:['*'],
 OPERATOR:['reports.read','reports.create','reports.assign','reports.close','cases.manage','tasks.manage','people.read','documents.manage','publications.read','projects.manage','audit.read'],
 EDITOR:['reports.read','reports.create','publications.read','publications.create','publications.approve','publications.publish','documents.manage','tasks.manage'],
 ENGINEER:['reports.read','reports.create','tasks.manage','documents.manage','publications.read','publications.create','people.read','projects.manage'],
 MEMBER:['reports.read','reports.create','tasks.manage','publications.read','people.read'],VIEWER:['reports.read','publications.read']};
const can=c=>{const r=ROLES[S.session.role]||[];return r.includes('*')||r.includes(c)};
/* ============ Workflow engine ============ */
const WF={
 report:{init:'SUBMITTED',t:{SUBMITTED:['RECEIVED'],RECEIVED:['IN_REVIEW'],IN_REVIEW:['ASSIGNED','RESOLVED'],ASSIGNED:['IN_PROGRESS'],IN_PROGRESS:['RESOLVED'],RESOLVED:['ARCHIVED','IN_PROGRESS'],ARCHIVED:[]},cap:{ARCHIVED:'reports.close',d:'reports.assign'}},
 case:{init:'OPEN',t:{OPEN:['IN_PROGRESS'],IN_PROGRESS:['RESOLVED'],RESOLVED:['CLOSED','IN_PROGRESS'],CLOSED:['OPEN']},cap:{d:'cases.manage'}},
 task:{init:'TODO',t:{TODO:['IN_PROGRESS'],IN_PROGRESS:['BLOCKED','REVIEW','TODO'],BLOCKED:['IN_PROGRESS'],REVIEW:['DONE','IN_PROGRESS'],DONE:['ARCHIVED'],ARCHIVED:[]},cap:{d:'tasks.manage'}},
 publication:{init:'DRAFT',t:{DRAFT:['EDITORIAL_REVIEW'],EDITORIAL_REVIEW:['APPROVED','DRAFT'],APPROVED:['PUBLISHED'],PUBLISHED:['ARCHIVED'],ARCHIVED:[]},cap:{EDITORIAL_REVIEW:'publications.create',APPROVED:'publications.approve',PUBLISHED:'publications.publish',ARCHIVED:'publications.publish',DRAFT:'publications.create',d:'publications.create'}},
 document:{init:'DRAFT',t:{DRAFT:['REVIEW'],REVIEW:['APPROVED','DRAFT'],APPROVED:['PUBLISHED'],PUBLISHED:['ARCHIVED'],ARCHIVED:[]},cap:{d:'documents.manage'}},
 person:{init:'ACTIVE',t:{ACTIVE:['INACTIVE'],INACTIVE:['ACTIVE']},cap:{d:'people.manage'}},
 project:{init:'PLANNED',t:{PLANNED:['ACTIVE'],ACTIVE:['ARCHIVED'],ARCHIVED:[]},cap:{d:'projects.manage'}},
 system:{init:'PLANNED',t:{PLANNED:['ACTIVE'],ACTIVE:['ARCHIVED'],ARCHIVED:[]},cap:{d:'projects.manage'}}};
const CAPM={report:'reports.assign',case:'cases.manage',task:'tasks.manage',person:'people.manage',document:'documents.manage',publication:'publications.create',project:'projects.manage',system:'projects.manage'};
const PRI=['NORMAL','LOW','HIGH','CRITICAL'];
const F=(k,l,t,o,req,max)=>({k,l,t,o,req,max});
const TYPES={report:{p:'RPT',label:'Report',cap:'reports.create',col:'#c07a45'},case:{p:'CASE',label:'Case',cap:'cases.manage',col:'#e0a370'},task:{p:'TSK',label:'Task',cap:'tasks.manage',col:'#9a8f80'},person:{p:'PPL',label:'Person',cap:'people.manage',col:'#eee6d6'},document:{p:'DOC',label:'Document',cap:'documents.manage',col:'#b39a7a'},publication:{p:'PUB',label:'Publication',cap:'publications.create',col:'#d8c3a0'},project:{p:'PRJ',label:'Project',cap:'projects.manage',col:'#8a4f2b'},system:{p:'SYS',label:'System',cap:'projects.manage',col:'#6b3f24'}};
const FORMS={
 report:[F('title','Title','',0,1,120),F('category','Category','select',['OPERATIONS','SECURITY','RESEARCH','ENGINEERING','OTHER']),F('priority','Priority','select',PRI),F('description','Description','textarea',0,1,4000)],
 case:[F('title','Title','',0,1,120),F('priority','Priority','select',PRI),F('description','Description','textarea')],
 task:[F('title','Title','',0,1,120),F('priority','Priority','select',PRI),F('deadline','Deadline','date'),F('description','Description','textarea')],
 person:[F('title','Name','',0,1,80),F('role','Role','select',Object.keys(ROLES)),F('contact','Contact email','email')],
 document:[F('title','Title','',0,1,120),F('doctype','Type','select',['SPEC','NOTE','POLICY','RUNBOOK','OTHER']),F('tags','Tags (comma separated)'),F('content','Content or reference','textarea')],
 publication:[F('title','Title','',0,1,160),F('ptype','Type','select',['ARTICLE','RESEARCH','STATEMENT','ANNOUNCEMENT','TECHNICAL NOTE']),F('summary','Summary','textarea',0,0,500),F('body','Body','textarea',0,1,20000),F('tags','Tags (comma separated)')],
 project:[F('title','Name','',0,1,80),F('description','Description','textarea'),F('repository','GitHub repository (owner/name)'),F('tags','Tags (comma separated; "public" shows on public site)')],
 system:[F('title','Name','',0,1,80),F('description','Description','textarea'),F('tags','Tags (comma separated; "public" shows on public site)')]};
const RELS=['AUTHORED_BY','ASSIGNED_TO','RELATED_TO','REFERENCES','DEPENDS_ON','USES','BELONGS_TO','CREATED_FROM','DERIVED_FROM','ATTACHED_TO','MEMBER_OF'];
/* ============ Event bus ============ */
const Bus={m:{},on(e,f){(this.m[e]=this.m[e]||[]).push(f)},emit(e,d){(this.m[e]||[]).forEach(f=>{try{f(d)}catch(x){console.error(x)}})}};
/* ============ API / Auth ============ */
const Api={async req(m,p,b){if(!CONFIG.api)throw{cat:'INTEGRATION',code:'NO_BACKEND',msg:'No backend configured'};let r;
  try{r=await fetch(CONFIG.api+p,{method:m,credentials:'include',headers:{'Content-Type':'application/json','X-CSRF-Token':S.csrf},body:b?JSON.stringify(b):undefined})}catch(e){S.api='UNREACHABLE';throw{cat:'NETWORK',msg:'Backend unreachable'}}
  S.api='REACHABLE';if(r.status===401){Auth.expired();throw{cat:'AUTH',msg:'Session expired or missing'}}if(r.status===403)throw{cat:'PERMISSION',msg:'Forbidden by server'};if(!r.ok)throw{cat:'NETWORK',msg:'HTTP '+r.status};return r.json()}};
const Auth={async init(){
  if(CONFIG.api){try{const s=await Api.req('GET','/api/session');S.csrf=s.csrf||'';S.session={actor:s.actor,role:s.role,expires:s.expires,mode:'SERVER'};return}catch(e){S.session={actor:'anonymous',role:'VIEWER',mode:'ANON'};if(e.cat==='AUTH'&&CONFIG.loginUrl)location.assign(CONFIG.loginUrl);return}}
  S.session={actor:S.cfg.actor||'local-operator',role:S.cfg.role||'ADMIN',mode:'LOCAL'}},
  expired(){if(S.session&&S.session.mode==='SERVER'){S.session={actor:'anonymous',role:'VIEWER',mode:'ANON'};if(CONFIG.loginUrl)location.assign(CONFIG.loginUrl);else render()}}};
const EmailService={async send(kind,p){try{const r=await Api.req('POST','/api/email/send',{kind,...p});return r.status||'PENDING'}catch(e){return e.code==='NO_BACKEND'?'NOT_SENT':'FAILED'}}};
/* ============ Audit ledger (append-only from the UI; hash chain is a local integrity aid, not a security control) ============ */
const Audit={add(action,target,prev,next,meta){const p=S.audit[0];const e={id:'AUD-'+String(S.audit.length+1).padStart(5,'0'),ts:now(),actor:S.session.actor,role:S.session.role,where:S.session.mode,action,target,prev:prev??null,next:next??null,meta:meta||{},sync:'PENDING',prevHash:p?p.hash:'0'};e.hash=hash(e.prevHash+JSON.stringify([e.ts,e.actor,action,target,prev,next]));S.audit.unshift(e);return e},
  verify(){for(let i=S.audit.length-1;i>=0;i--){const e=S.audit[i],p=S.audit[i+1];if(e.prevHash!==(p?p.hash:'0')||e.hash!==hash(e.prevHash+JSON.stringify([e.ts,e.actor,e.action,e.target,e.prev,e.next])))return false}return true}};
/* ============ Data service & commit pipeline ============ */
const visible=o=>!(o.type==='person'&&o.props.role==='ADMIN'&&!can('people.manage'));
const Data={get:id=>{const o=S.objects[id];return o&&visible(o)?o:null},
 list:(t,f)=>Object.values(S.objects).filter(o=>visible(o)&&(!t||o.type===t)&&(!f||f(o))).sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt)),
 async hydrate(){try{const r=await Api.req('GET','/api/objects');for(const o of r.objects||[])S.objects[o.id]={notes:[],tags:[],props:{},...o,sync:'CONFIRMED'};if(r.rels)S.rels=r.rels;Storage.save()}catch(e){Err.show(e.cat||'NETWORK',e.msg||'Could not load objects')}}};
const relsOf=id=>S.rels.filter(r=>r.from===id||r.to===id);
async function commit(c){c.apply();const o=S.objects[c.target];if(o){o.updatedAt=now();o.version=(o.version||0)+1;o.sync='PENDING'}
 const a=Audit.add(c.action,c.target,c.prev,c.next,c.meta);Bus.emit('mutation',{...c,audit:a,obj:o});Storage.save();render();
 if(!CONFIG.api)return a;let st='FAILED';
 if(!S.online)Err.show('NETWORK','Offline — change kept locally, not sent','use Settings → Retry sync when online');
 else try{const r=await Api.req('POST','/api/mutations',{audit:a,object:o});st=r.confirmed===true?'CONFIRMED':'PENDING';if(r.id&&o)o.serverId=r.id}catch(e){Err.show(e.cat||'UNKNOWN',e.msg||'Request failed','retry from Settings')}
 a.sync=st;if(o)o.sync=st;Storage.save();render();return a}
const Sync={async flush(){if(!CONFIG.api)return Err.show('INTEGRATION','No backend configured');let n=0,f=0;for(const a of [...S.audit].reverse().filter(a=>a.sync!=='CONFIRMED')){try{const r=await Api.req('POST','/api/mutations',{audit:a,object:S.objects[a.target]});a.sync=r.confirmed===true?'CONFIRMED':'PENDING';n++}catch(e){a.sync='FAILED';f++}}
  for(const o of Object.values(S.objects)){const l=S.audit.find(a=>a.target===o.id);if(l)o.sync=l.sync}Storage.save();Notif.push('SYNC_COMPLETE',null,n+' sent, '+f+' failed');render()}};
/* ============ Domain actions ============ */
const Dom={
 async create(type,d){const T=TYPES[type],core={title:1,priority:1,tags:1},props={};for(const k in d)if(!core[k])props[k]=d[k];
  const cap=T.cap;if(!can(cap))throw{msg:'Missing capability '+cap};if(type==='project'&&d.repository&&!/^[\w.-]+\/[\w.-]+$/.test(d.repository))throw{msg:'Repository must look like owner/name'};
  const n=S.seq[type]=(S.seq[type]||0)+1;const o={id:T.p+'-L'+String(n).padStart(4,'0'),type,title:d.title,status:WF[type].init,priority:type==='report'||type==='case'||type==='task'?d.priority||'NORMAL':null,tags:(d.tags||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),props,notes:[],author:S.session.actor,createdAt:now(),updatedAt:now(),version:0,sync:'PENDING'};
  const act={report:'REPORT_CREATED',case:'CASE_CREATED'}[type]||'OBJECT_CREATED';
  await commit({action:act,target:o.id,prev:null,next:{status:o.status,title:o.title},apply:()=>{S.objects[o.id]=o}});return o},
 async update(id,d){const o=S.objects[id],cap=CAPM[o.type];if(!can(cap))throw{msg:'Missing capability '+cap};const prev={},next={};
  for(const k in d){const cur=k==='title'?o.title:k==='priority'?o.priority:k==='tags'?o.tags.join(', '):o.props[k]||'';if(cur!==d[k]){prev[k]=cur;next[k]=d[k]}}
  if(!Object.keys(next).length)return;await commit({action:'UPDATED',target:id,prev,next,apply:()=>{for(const k in next){if(k==='title')o.title=next[k];else if(k==='priority')o.priority=next[k];else if(k==='tags')o.tags=next[k].split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);else o.props[k]=next[k]}}})},
 async transition(id,to){const o=S.objects[id],w=WF[o.type];if(!(w.t[o.status]||[]).includes(to))return Err.show('VALIDATION','Invalid transition '+o.status+' → '+to);
  const cap=w.cap[to]||w.cap.d;if(!can(cap))return Err.show('PERMISSION','Missing capability '+cap);const prev=o.status;
  await commit({action:'STATUS_CHANGED',target:id,prev:{status:prev},next:{status:to},apply:()=>{o.status=to;if(to==='PUBLISHED')o.props.publishedAt=now()}})},
 async assign(id,pid){const o=S.objects[id],cap={report:'reports.assign',case:'cases.manage',task:'tasks.manage'}[o.type];if(!cap||!can(cap))throw{msg:'Missing capability '+(cap||'n/a')};
  const old=S.rels.find(r=>r.from===id&&r.type==='ASSIGNED_TO');
  await commit({action:'ASSIGNED',target:id,prev:{to:old?old.to:null},next:{to:pid},apply:()=>{S.rels=S.rels.filter(r=>!(r.from===id&&r.type==='ASSIGNED_TO'));S.rels.push({id:'REL-'+Date.now(),from:id,type:'ASSIGNED_TO',to:pid,ts:now()})}});
  if(o.type==='report'&&o.status==='IN_REVIEW')await Dom.transition(id,'ASSIGNED')},
